dataset_metadata:
  name: Synthetic NBA Tier-I Engineering Accreditation Dataset
  is_synthetic: true
  total_actions: 45
  total_criteria: 10
  description: Synthetic programme profile and actions using official NBA SAR criterion marks.
planning_parameters:
  budget_lakh: 30.0
  planning_horizon_months: 12
  monthly_faculty_capacity: 300.0
  min_accreditation_score: 750.0 # R depends on accreditation scheme/period; confirm against NBA manual
data:
  criteria_file: data/nba_criteria.csv
  subcriteria_file: data/nba_subcriteria.csv
  profile_file: data/profile.csv
  actions_file: data/actions.csv
  seed: 42
algorithm_parameters:
  random_seed: 42
  population_size: 100
  max_generations: 120
  crossover_probability: 0.9
  mutation_probability: 0.15
  tournament_size: 2
  archive_size: 100
  moead_neighbors: 15
  spea2_archive_size: 100
  local_search_iterations: 20
experiments:
  seeds:
  - 42
  - 101
  - 2024
  - 777
  - 999
  algorithms:
  - NSGA-II
  - SPEA2
  - MOEA/D
  - Hybrid-Memetic
  - Greedy-Baseline
  - Random-Baseline
  - MILP-HiGHS
  metrics:
  - hypervolume
  - spacing
  - spread
  - coverage
  - feasibility_rate
